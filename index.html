<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Derivadas Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/mathjs@11.8.0/lib/browser/math.js"></script>
    <script src="https://unpkg.com/lucide@0.263.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .math-font { font-family: 'Cambria Math', 'serif'; font-style: italic; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = FramerMotion;

        const Header = () => (
            <header className="mb-8 text-center">
                <div className="flex justify-center mb-4">
                    <div className="p-3 bg-blue-600 rounded-2xl shadow-lg shadow-blue-500/20">
                        <i data-lucide="function-square" className="text-white w-8 h-8"></i>
                    </div>
                </div>
                <h1 className="text-3xl font-bold tracking-tight text-white">Calculadora de Derivadas</h1>
                <p className="text-slate-400 mt-2">Cálculo simbólico profesional</p>
            </header>
        );

        const ErrorMessage = ({ message }) => (
            <motion.div
                initial={{ opacity: 0, y: -10 }}
                animate={{ opacity: 1, y: 0 }}
                exit={{ opacity: 0 }}
                className="bg-red-500/10 border border-red-500/50 p-4 rounded-xl flex items-center gap-3 text-red-400 mb-6"
            >
                <i data-lucide="alert-circle" className="w-5 h-5"></i>
                <span className="text-sm font-medium">{message}</span>
            </motion.div>
        );

        const ResultCard = ({ expression, result, onCopy }) => (
            <motion.div
                initial={{ opacity: 0, scale: 0.95 }}
                animate={{ opacity: 1, scale: 1 }}
                className="glass-card p-6 rounded-2xl border-l-4 border-l-blue-500 shadow-xl"
            >
                <div className="flex justify-between items-start mb-4">
                    <span className="text-xs font-bold uppercase tracking-widest text-blue-400">Resultado</span>
                    <button
                        onClick={() => onCopy(result)}
                        className="p-2 hover:bg-white/10 rounded-lg transition-colors"
                    >
                        <i data-lucide="copy" className="w-4 h-4 text-slate-400"></i>
                    </button>
                </div>
                <div className="space-y-4">
                    <div>
                        <p className="text-slate-500 text-xs mb-1">Función f(x):</p>
                        <p className="text-lg math-font text-slate-200">{expression}</p>
                    </div>
                    <div className="h-px bg-white/5 w-full"></div>
                    <div>
                        <p className="text-blue-400 text-xs mb-1 font-semibold">Derivada f'(x):</p>
                        <p className="text-2xl math-font text-white break-words">{result}</p>
                    </div>
                </div>
            </motion.div>
        );

        const App = () => {
            const [input, setInput] = useState('');
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [history, setHistory] = useState([]);

            useEffect(() => {
                lucide.createIcons();
            }, [result, error, history]);

            const handleDerive = () => {
                if (!input.trim()) return;
                try {
                    setError(null);
                    const derivative = math.derivative(input, 'x').toString();
                    const simplified = math.simplify(derivative).toString();
                    setResult(simplified);
                    setHistory(prev => [{f: input, df: simplified}, ...prev].slice(0, 5));
                } catch (err) {
                    setError("Error en la expresión. Ejemplo: x^2 + sin(x)");
                    setResult(null);
                }
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
            };

            return (
                <div className="min-h-screen p-6 flex flex-col items-center">
                    <div className="w-full max-w-2xl">
                        <Header />
                        <div className="glass-card p-6 rounded-3xl shadow-2xl mb-8">
                            <input
                                type="text"
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                placeholder="Escribe tu función..."
                                className="w-full bg-slate-900/50 border border-slate-700 text-white rounded-xl px-5 py-4 mb-4 focus:ring-2 focus:ring-blue-500 outline-none text-lg math-font"
                                onKeyDown={(e) => e.key === 'Enter' && handleDerive()}
                            />
                            <button
                                onClick={handleDerive}
                                className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2"
                            >
                                <i data-lucide="zap" className="w-5 h-5"></i> Derivar
                            </button>
                        </div>

                        <AnimatePresence>
                            {error && <ErrorMessage message={error} />}
                            {result && <ResultCard expression={input} result={result} onCopy={copyToClipboard} />}
                        </AnimatePresence>

                        {history.length > 0 && (
                            <div className="mt-8">
                                <h3 className="text-slate-500 text-xs font-bold uppercase mb-4 tracking-widest">Historial</h3>
                                {history.map((h, i) => (
                                    <div key={i} className="glass-card p-3 rounded-lg mb-2 text-sm flex justify-between items-center">
                                        <span className="truncate text-slate-300 math-font">d/dx({h.f}) = {h.df}</span>
                                        <button onClick={() => setInput(h.f)} className="text-blue-400 hover:text-white">Usar</button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
